services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-patrimonio_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bjfree12}

  web:
    build: .
    restart: unless-stopped
    expose:
      - 8000
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
      DEBUG: "False"
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro

volumes:
  postgres_data:
  static_volume:
