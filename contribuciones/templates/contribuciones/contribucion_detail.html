{% extends "base.html" %}

{% block title %}Contribución #{{ contribucion.pk }} — Detalle{% endblock %}

{% block content %}
<div class="card" style="max-width:760px; margin:0 auto;">
  <div class="card-header">
    <span>🔍 Contribución #{{ contribucion.pk }}</span>
    <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
      <a href="{% url 'contribuciones:editar'   contribucion.pk %}" class="btn btn-primary btn-sm">✏ Editar</a>
      <a href="{% url 'contribuciones:eliminar' contribucion.pk %}" class="btn btn-danger btn-sm">🗑 Eliminar</a>
    </div>
  </div>

  <table class="detail-table">
    <tbody>
      {% for label, valor in campos %}
      <tr>
        <td>{{ label }}</td>
        <td>{{ valor }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="btn-group">
    <a href="{% url 'contribuciones:lista' %}" class="btn btn-secondary">← Volver al listado</a>
    <a href="{% url 'contribuciones:editar' contribucion.pk %}" class="btn btn-primary">✏ Editar</a>
  </div>
</div>
{% endblock %}
